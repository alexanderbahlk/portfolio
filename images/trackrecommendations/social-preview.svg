<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="80%"  stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#090909"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e1e1e" stroke-width="1" opacity="0.6">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Radial glow behind text -->
  <ellipse cx="600" cy="315" rx="460" ry="260" fill="url(#glow)"/>

  <!-- Decorative top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#line-fade)"/>

  <!-- App title label -->
  <text
    x="600" y="230"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="4"
    text-anchor="middle"
    fill="#a855f7"
    text-transform="uppercase"
    style="text-transform:uppercase"
  >WHAT TO PLAY NEXT</text>

  <!-- Main headline -->
  <text
    x="600" y="320"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="76"
    font-weight="700"
    letter-spacing="-2"
    text-anchor="middle"
    fill="#ececec"
  >nexttrack.club</text>

  <!-- Subline -->
  <text
    x="600" y="388"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="400"
    letter-spacing="0.5"
    text-anchor="middle"
    fill="#777"
  >DJ track recommendations powered by real set data</text>

  <!-- Three feature pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="1">
    <!-- Pill 1 -->
    <rect x="294" y="434" width="168" height="34" rx="17" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
    <text x="378" y="456" text-anchor="middle" fill="#22c55e" style="text-transform:uppercase">CUED AFTER</text>
    <!-- Pill 2 -->
    <rect x="516" y="434" width="168" height="34" rx="17" fill="rgba(96,165,250,0.1)" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
    <text x="600" y="456" text-anchor="middle" fill="#60a5fa" style="text-transform:uppercase">VIBE MATCH</text>
    <!-- Pill 3 -->
    <rect x="738" y="434" width="168" height="34" rx="17" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
    <text x="822" y="456" text-anchor="middle" fill="#a855f7" style="text-transform:uppercase">HYBRID</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#line-fade)"/>
</svg>
